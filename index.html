<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>Livreurs</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-bar">Livreurs</header>
  <main>
    <h1>Connexion</h1>
    <form class="login" action="/api/connexion" method="post">
      <label for="code">Code livreur</label>
      <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
      <button type="submit" class="big-button">Commencer ma tournée</button>
    </form>
  </main>
</body>
</html>
