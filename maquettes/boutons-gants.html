<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boutons pour gants</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/maquettes/boutons-gants.css">
</head>
<body>
  <header class="app-bar">Arrêt n° 3 , Mme Haddad</header>
  <main>
    <h2>Aujourd'hui (56 px)</h2>
    <div class="glove-current">
      <button class="big-button" type="button">Livré</button>
      <button class="big-button" type="button">Échec</button>
    </div>
    <h2>Proposition (72 px)</h2>
    <div class="glove-proposal">
      <button class="big-button glove-main" type="button">Livré</button>
      <button class="big-button glove-secondary" type="button">Échec</button>
      <button class="big-button glove-secondary" type="button">Appeler</button>
    </div>
    <p class="muted">Zones tactiles de 72 px de haut, 16 px d'écart, le bouton "Livré" occupe toute la largeur.</p>
  </main>
</body>
</html>
