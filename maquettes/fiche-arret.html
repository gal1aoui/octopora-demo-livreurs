<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fiche d'un arrêt</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/maquettes/fiche-arret.css">
</head>
<body>

  <header class="app-bar">Arrêt 3 sur 4</header>
  <main class="fiche">
    <h1>Mme Haddad</h1>
    <p class="muted">8 rue de Marseille, Tunis<br>Créneau 10:00-12:00</p>
    <section class="fiche-card">
      <h2>Colis</h2>
      <p>1 colis, 2,4 kg, fragile</p>
      <p class="muted">Réf. TN-482-910</p>
    </section>
    <section class="fiche-card">
      <h2>Consignes</h2>
      <p>Sonner deux fois, 3e étage sans ascenseur. Laisser chez la voisine du 2e en cas d'absence.</p>
    </section>
    <button class="big-button" type="button">Appeler Mme Haddad</button>
    <button class="big-button fiche-nav" type="button">Y aller</button>
    <button class="big-button fiche-done" type="button">Marquer comme livré</button>
  </main>
</body>
</html>
