<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Préférences de notification</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/maquettes/preferences-notifications.css">
</head>
<body>

  <header class="app-bar">Notifications</header>
  <main>
    <p class="muted">Choisissez ce qui vous alerte pendant la tournée.</p>
    <label class="pref"><span>Changement de tournée<br><small>Arrêt ajouté, déplacé ou retiré</small></span><input type="checkbox" checked></label>
    <label class="pref"><span>Message du superviseur<br><small>Consignes urgentes</small></span><input type="checkbox" checked></label>
    <label class="pref"><span>Rappel de créneau<br><small>15 minutes avant la fin du créneau</small></span><input type="checkbox"></label>
    <label class="pref"><span>Son et vibration<br><small>Désactiver pour une alerte silencieuse</small></span><input type="checkbox" checked></label>
    <button class="big-button" type="button">Enregistrer</button>
  </main>
</body>
</html>
