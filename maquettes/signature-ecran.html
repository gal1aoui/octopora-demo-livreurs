<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signature du destinataire à l'écran</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/maquettes/signature-ecran.css">
</head>
<body>

  <header class="app-bar">Signature</header>
  <main>
    <p>Le destinataire signe pour la livraison n° <strong>TN-482-910</strong>.</p>
    <div class="signature-pad" role="img" aria-label="Zone de signature">
      <span class="signature-hint">Signez ici avec le doigt</span>
    </div>
    <p class="muted">En signant, le destinataire confirme avoir reçu le colis en bon état.</p>
    <button class="big-button signature-clear" type="button">Effacer</button>
    <button class="big-button" type="button">Valider la signature</button>
  </main>
</body>
</html>
